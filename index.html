<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ride Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161B;
    --panel:#1A2028;
    --line:#2B333D;
    --text:#E9EDF1;
    --muted:#8A96A3;
    --power:#C6E86B;
    --hr:#E88B6B;
    --speed:#6BB8E8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    padding:48px 24px 80px;
    background-color:var(--bg);
    background-image:
      radial-gradient(1100px 600px at 12% -10%, rgba(198,232,107,0.06), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(107,184,232,0.05), transparent 55%),
      linear-gradient(180deg, #14191F 0%, #0F1318 100%),
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:auto, auto, auto, 42px 42px, 42px 42px;
    background-repeat:no-repeat, no-repeat, no-repeat, repeat, repeat;
    background-attachment:fixed;
  }
  .wrap{max-width:1200px;margin:0 auto;}

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:2rem;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .subtitle{color:var(--muted);font-size:0.9rem;margin-bottom:36px;}

  .totals{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:40px;
  }
  .total-cell{
    background:var(--panel);
    padding:20px 16px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .total-cell .num{
    font-family:'Space Grotesk', sans-serif;
    font-size:1.7rem;
    font-weight:700;
  }
  .total-cell .label{
    font-size:0.72rem;
    color:var(--muted);
    margin-top:4px;
  }

  .table-wrap{
    border:1px solid var(--line);
    overflow-x:auto;
    box-shadow:0 20px 40px -20px rgba(0,0,0,0.5);
  }
  table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    font-size:0.72rem;
    white-space:nowrap;
  }
  col.name{width:20%;}
  col.date{width:9%;}
  col.sm{width:6%;}
  col.pair{width:11%;}
  thead th{
    text-align:left;
    font-weight:500;
    color:var(--muted);
    font-size:0.62rem;
    letter-spacing:0.02em;
    padding:5px 8px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    cursor:pointer;
    user-select:none;
  }
  thead th:hover{color:var(--text);}
  thead th.sorted{color:var(--power);}
  tbody td{
    padding:3px 8px;
    border-bottom:1px solid var(--line);
    line-height:1.5;
  }
  tbody tr:hover{background:var(--panel);}
  tbody tr:last-child td{border-bottom:none;}
  td.name{
    font-family:'Space Grotesk', sans-serif;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  td.num{text-align:left;font-variant-numeric:tabular-nums;}
  td.power{color:var(--power);}
  td.hr{color:var(--hr);}
  td.speed{color:var(--speed);}
  td.muted{color:var(--muted);}
  .pair-max{color:var(--muted);font-size:0.9em;}

  #picker-wrap{
    display:none;
    border:1px dashed var(--line);
    padding:28px;
    text-align:center;
    color:var(--muted);
    margin-bottom:32px;
    font-size:0.85rem;
  }
  #picker-wrap.show{display:block;}
  #picker-wrap button{
    background:var(--power);
    color:#12161B;
    border:none;
    padding:8px 18px;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:0.8rem;
    cursor:pointer;
    margin-top:10px;
  }
  #status{color:var(--muted);font-size:0.8rem;margin-bottom:20px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ride Log</h1>
  <div class="subtitle">Virtual rides — MyWhoosh</div>

  <div id="status"></div>

  <div id="picker-wrap">
    Couldn't auto-load <code>data.json</code> (browsers block this when a page is opened directly from disk).<br>
    Pick the file manually instead:
    <br>
    <input type="file" id="file-input" accept=".json">
  </div>

  <div id="totals" class="totals"></div>

  <div class="table-wrap">
    <table id="ride-table">
      <colgroup>
        <col class="date">
        <col class="name">
        <col class="sm">
        <col class="sm">
        <col class="sm">
        <col class="pair">
        <col class="pair">
        <col class="pair">
        <col class="sm">
        <col class="sm">
        <col class="sm">
      </colgroup>
      <thead>
        <tr>
          <th data-key="date">Date</th>
          <th data-key="map_name">Route</th>
          <th data-key="distance_km" class="num">Km</th>
          <th data-key="moving_time" class="num">Time</th>
          <th data-key="elevation_m" class="num">Elev</th>
          <th data-key="power_avg_w" class="num power">Watts (avg/max)</th>
          <th data-key="speed_avg_kmh" class="num speed">km/h (avg/max)</th>
          <th data-key="heart_rate_avg_bpm" class="num hr">HR (avg/max)</th>
          <th data-key="cadence_avg" class="num">Cad</th>
          <th data-key="calories" class="num">Cal</th>
          <th data-key="relative_effort" class="num">Effort</th>
        </tr>
      </thead>
      <tbody id="rides"></tbody>
    </table>
  </div>
</div>

<script>
let currentRides = [];
let sortKey = 'date';
let sortAsc = true;

const fmt = (v, unit = '') => (v === null || v === undefined) ? '—' : `${v}${unit}`;

function parseDuration(str) {
  if (!str) return 0;
  const parts = str.split(':').map(Number);
  if (parts.some(isNaN)) return 0;
  return parts.reduce((acc, p) => acc * 60 + p, 0);
}

function formatDuration(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.round((totalSeconds % 3600) / 60);
  if (h === 0) return `${m}m`;
  return `${h}h ${m}m`;
}

function renderTotals(rides) {
  const totalDist = rides.reduce((s, r) => s + (r.distance_km || 0), 0);
  const totalCals = rides.reduce((s, r) => s + (r.calories || 0), 0);
  const totalKj = rides.reduce((s, r) => s + (r.total_work_kj || 0), 0);
  const totalTime = rides.reduce((s, r) => s + parseDuration(r.moving_time), 0);

  document.getElementById('totals').innerHTML = `
    <div class="total-cell"><div class="num">${rides.length}</div><div class="label">RIDES</div></div>
    <div class="total-cell"><div class="num">${totalDist.toFixed(1)}</div><div class="label">TOTAL KM</div></div>
    <div class="total-cell"><div class="num">${formatDuration(totalTime)}</div><div class="label">TOTAL TIME</div></div>
    <div class="total-cell"><div class="num">${totalCals}</div><div class="label">CALORIES</div></div>
    <div class="total-cell"><div class="num">${totalKj}</div><div class="label">TOTAL WORK (kJ)</div></div>
  `;
}

function renderRows() {
  const sorted = currentRides.slice().sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (av === null || av === undefined) av = sortAsc ? Infinity : -Infinity;
    if (bv === null || bv === undefined) bv = sortAsc ? Infinity : -Infinity;
    if (typeof av === 'string') return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortAsc ? av - bv : bv - av;
  });

  const pair = (a, b) => `${fmt(a)}<span class="pair-max">/${fmt(b)}</span>`;

  document.getElementById('rides').innerHTML = sorted.map(r => `
    <tr>
      <td class="muted">${fmt(r.date)}</td>
      <td class="name" title="${r.map_name || ''}">${r.map_name || '—'}</td>
      <td class="num">${fmt(r.distance_km)}</td>
      <td class="num muted">${fmt(r.moving_time)}</td>
      <td class="num muted">${fmt(r.elevation_m)}</td>
      <td class="num power">${pair(r.power_avg_w, r.power_max_w)}</td>
      <td class="num speed">${pair(r.speed_avg_kmh, r.speed_max_kmh)}</td>
      <td class="num hr">${pair(r.heart_rate_avg_bpm, r.heart_rate_max_bpm)}</td>
      <td class="num muted">${fmt(r.cadence_avg)}</td>
      <td class="num muted">${fmt(r.calories)}</td>
      <td class="num muted">${fmt(r.relative_effort)}</td>
    </tr>
  `).join('');

  document.querySelectorAll('thead th').forEach(th => {
    th.classList.toggle('sorted', th.dataset.key === sortKey);
  });
}

function render(data) {
  currentRides = data.rides || [];
  renderTotals(currentRides);
  renderRows();
  document.getElementById('status').textContent = `Loaded ${currentRides.length} ride(s) from data.json`;
}

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = key;
      sortAsc = true;
    }
    renderRows();
  });
});

function showPicker() {
  document.getElementById('picker-wrap').classList.add('show');
  document.getElementById('status').textContent = '';
  document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = JSON.parse(evt.target.result);
        render(data);
        document.getElementById('picker-wrap').classList.remove('show');
      } catch (err) {
        document.getElementById('status').textContent = 'Could not parse that file as JSON.';
      }
    };
    reader.readAsText(file);
  });
}

fetch('data.json')
  .then(res => {
    if (!res.ok) throw new Error('not found');
    return res.json();
  })
  .then(render)
  .catch(() => showPicker());
</script>
</body>
</html>
