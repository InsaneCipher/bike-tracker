<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/png" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1B19;
    --bg-deep:#141312;
    --panel:#242220;
    --line:#3A3733;
    --text:#EEEAE3;
    --muted:#9A9186;
    --power:#E8B93F;
    --hr:#C1523B;
    --speed:#4FB6A8;
    --display:'Oswald', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    font-family:var(--mono);
    padding:48px 24px 80px;
    background-color:var(--bg);
    background-image:
      radial-gradient(1000px 560px at 8% -12%, rgba(232,185,63,0.05), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(79,182,168,0.045), transparent 55%),
      linear-gradient(180deg, #1E1D1B 0%, var(--bg-deep) 100%);
    background-repeat:no-repeat;
    background-attachment:fixed;
  }
  .wrap{max-width:1200px;margin:0 auto;}

  h1{
    font-family:var(--display);
    font-weight:700;
    font-size:2.4rem;
    letter-spacing:0.01em;
    margin:0 0 6px;
  }
  .subtitle{color:var(--muted);font-size:0.92rem;margin-bottom:20px;}

  /* Signature detail: a single checkered finish-line rule */
  .finish-line{
    height:9px;
    background-image: conic-gradient(var(--muted) 90deg, transparent 90deg 180deg, var(--muted) 180deg 270deg, transparent 270deg 360deg);
    background-size:18px 18px;
    opacity:0.5;
    margin-bottom:28px;
  }

  .totals{
    display:flex;
    flex-wrap:wrap;
    border:1px solid var(--line);
    background:var(--panel);
    margin-bottom:36px;
  }
  .total-cell{
    flex:1 1 0;
    min-width:120px;
    padding:18px 22px;
    border-right:1px solid var(--line);
  }
  .total-cell:last-child{border-right:none;}
  .total-cell .num{
    font-family:var(--mono);
    font-size:1.55rem;
    font-weight:600;
  }
  .total-cell .label{
    font-family:var(--display);
    font-weight:400;
    font-size:0.8rem;
    color:var(--muted);
    margin-top:3px;
    letter-spacing:0.01em;
  }

  /* Tabs */
  .tabs{
    display:flex;
    gap:4px;
    border-bottom:1px solid var(--line);
    margin-bottom:22px;
  }
  .tab-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-family:var(--display);
    font-weight:500;
    font-size:0.95rem;
    padding:10px 16px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--power);border-bottom-color:var(--power);}

  .view{display:none;}
  .view.active{display:block;}

  .table-wrap{
    border:1px solid var(--line);
    overflow-x:auto;
  }
  table{
    width:100%;
    min-width:1190px;
    table-layout:fixed;
    border-collapse:collapse;
    font-size:0.74rem;
    white-space:nowrap;
  }
  col.idx{width:3.5%;}
  col.name{width:16%;}
  col.date{width:9%;}
  col.sm{width:6%;}
  col.pair{width:11%;}
  thead th{
    text-align:left;
    font-family:var(--display);
    font-weight:500;
    color:var(--muted);
    font-size:0.72rem;
    padding:8px 10px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    cursor:pointer;
    user-select:none;
  }
  thead th:hover{color:var(--text);}
  thead th.sorted{color:var(--power);}
  tbody td{
    padding:6px 10px;
    border-bottom:1px solid var(--line);
    line-height:1.5;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  tbody tr:nth-child(even){background:rgba(255,255,255,0.015);}
  tbody tr:hover{background:rgba(232,185,63,0.05);}
  tbody tr:last-child td{border-bottom:none;}
  td.idx{color:var(--muted);}
  td.name{
    font-family:var(--display);
    font-weight:400;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  td.num{text-align:left;font-variant-numeric:tabular-nums;}
  td.power{color:var(--power);}
  td.hr{color:var(--hr);}
  td.speed{color:var(--speed);}
  td.muted{color:var(--muted);}
  .pair-max{color:var(--muted);font-size:0.9em;}

  /* Graph view */
  .metric-picker{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:22px;
  }
  .metric-btn{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--muted);
    font-family:var(--display);
    font-weight:500;
    font-size:0.82rem;
    padding:6px 14px;
    cursor:pointer;
  }
  .metric-btn:hover{color:var(--text);border-color:#4a4540;}
  .metric-btn.active{font-weight:600;}

  .chart-wrap{
    border:1px solid var(--line);
    background:var(--panel);
    padding:22px;
    position:relative;
  }
  .chart-wrap svg{display:block;width:100%;height:auto;}
  .chart-empty{color:var(--muted);font-size:0.9rem;text-align:center;padding:60px 0;font-family:var(--display);}

  #tooltip{
    position:absolute;
    display:none;
    background:var(--bg-deep);
    border:1px solid var(--line);
    padding:6px 10px;
    font-size:0.72rem;
    pointer-events:none;
    white-space:nowrap;
    z-index:10;
  }
  #tooltip .t-date{color:var(--muted);}
  #tooltip .t-val{font-family:var(--mono);font-weight:700;}

  #picker-wrap{
    display:none;
    border:1px dashed var(--line);
    padding:28px;
    text-align:center;
    color:var(--muted);
    margin-bottom:32px;
    font-size:0.85rem;
  }
  #picker-wrap.show{display:block;}
  #picker-wrap button{
    background:var(--power);
    color:var(--bg-deep);
    border:none;
    padding:8px 18px;
    font-family:var(--display);
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
    margin-top:10px;
  }
  #status{color:var(--muted);font-size:0.82rem;margin-bottom:22px;}

  @media (max-width: 640px){
    body{padding:28px 14px 60px;}
    h1{font-size:1.7rem;}
    .subtitle{margin-bottom:16px;}
    .finish-line{margin-bottom:20px;}
    .totals{margin-bottom:24px;}
    .total-cell{flex:1 1 45%;border-right:none;border-bottom:1px solid var(--line);padding:14px 16px;}
    .total-cell .num{font-size:1.3rem;}
    .total-cell .label{font-size:0.72rem;}
    .tabs{margin-bottom:16px;}
    .tab-btn{padding:8px 12px;font-size:0.85rem;}
    .metric-btn{padding:5px 11px;font-size:0.76rem;}
    .chart-wrap{padding:12px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ride Log</h1>
  <div class="subtitle">Virtual rides — MyWhoosh</div>
  <div class="finish-line"></div>

  <div id="status"></div>

  <div id="picker-wrap">
    Couldn't auto-load <code>data.json</code> (browsers block this when a page is opened directly from disk).<br>
    Pick the file manually instead:
    <br>
    <input type="file" id="file-input" accept=".json">
  </div>

  <div id="totals" class="totals"></div>

  <div class="tabs">
    <button class="tab-btn active" data-view="table-view">Table</button>
    <button class="tab-btn" data-view="graph-view">Graphs</button>
  </div>

  <div id="table-view" class="view active">
    <div class="table-wrap">
      <table id="ride-table">
        <colgroup>
          <col class="idx">
          <col class="date">
          <col class="name">
          <col class="sm">
          <col class="sm">
          <col class="sm">
          <col class="pair">
          <col class="sm">
          <col class="pair">
          <col class="pair">
          <col class="sm">
          <col class="sm">
          <col class="sm">
        </colgroup>
        <thead>
          <tr>
            <th class="idx">#</th>
            <th data-key="date">Date</th>
            <th data-key="map_name">Route</th>
            <th data-key="distance_km" class="num">Km</th>
            <th data-key="moving_time" class="num">Time</th>
            <th data-key="elevation_m" class="num">Elev</th>
            <th data-key="power_avg_w" class="num power">Watts (avg/max)</th>
            <th data-key="ftp" class="num power">FTP</th>
            <th data-key="speed_avg_kmh" class="num speed">km/h (avg/max)</th>
            <th data-key="heart_rate_avg_bpm" class="num hr">HR (avg/max)</th>
            <th data-key="cadence_avg" class="num">Cad</th>
            <th data-key="calories" class="num">Cal</th>
            <th data-key="relative_effort" class="num">Effort</th>
          </tr>
        </thead>
        <tbody id="rides"></tbody>
      </table>
    </div>
  </div>

  <div id="graph-view" class="view">
    <div class="metric-picker" id="metric-picker"></div>
    <div class="chart-wrap">
      <div id="chart-container"></div>
      <div id="tooltip"></div>
    </div>
  </div>
</div>

<script>
let currentRides = [];
let sortKey = 'date';
let sortAsc = true;
let activeMetric = 'power';

const fmt = (v, unit = '') => (v === null || v === undefined) ? '—' : `${v}${unit}`;

function parseDuration(str) {
  if (!str) return 0;
  const parts = str.split(':').map(Number);
  if (parts.some(isNaN)) return 0;
  return parts.reduce((acc, p) => acc * 60 + p, 0);
}

function formatDuration(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.round((totalSeconds % 3600) / 60);
  if (h === 0) return `${m}m`;
  return `${h}h ${m}m`;
}

function renderTotals(rides) {
  const totalDist = rides.reduce((s, r) => s + (r.distance_km || 0), 0);
  const totalCals = rides.reduce((s, r) => s + (r.calories || 0), 0);
  const totalKj = rides.reduce((s, r) => s + (r.total_work_kj || 0), 0);
  const totalTime = rides.reduce((s, r) => s + parseDuration(r.moving_time), 0);
  const totalElevation = rides.reduce((s, r) => s + (r.elevation_m || 0), 0);

  document.getElementById('totals').innerHTML = `
    <div class="total-cell"><div class="num">${rides.length}</div><div class="label">Rides logged</div></div>
    <div class="total-cell"><div class="num">${totalDist.toFixed(1)}</div><div class="label">Total distance (km)</div></div>
    <div class="total-cell"><div class="num">${formatDuration(totalTime)}</div><div class="label">Time in the saddle</div></div>
    <div class="total-cell"><div class="num">${totalElevation}</div><div class="label">Total elevation (m)</div></div>
    <div class="total-cell"><div class="num">${totalCals}</div><div class="label">Calories burned</div></div>
    <div class="total-cell"><div class="num">${totalKj}</div><div class="label">Total work (kJ)</div></div>
  `;
}

function renderRows() {
  const sorted = currentRides.slice().sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (av === null || av === undefined) av = sortAsc ? Infinity : -Infinity;
    if (bv === null || bv === undefined) bv = sortAsc ? Infinity : -Infinity;
    if (typeof av === 'string') return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortAsc ? av - bv : bv - av;
  });

  const pair = (a, b) => `${fmt(a)}<span class="pair-max">/${fmt(b)}</span>`;

  document.getElementById('rides').innerHTML = sorted.map((r, i) => `
    <tr>
      <td class="idx">${i + 1}</td>
      <td class="muted">${fmt(r.date)}</td>
      <td class="name" title="${r.map_name || ''}">${r.map_name || '—'}</td>
      <td class="num">${fmt(r.distance_km)}</td>
      <td class="num muted">${fmt(r.moving_time)}</td>
      <td class="num muted">${fmt(r.elevation_m)}</td>
      <td class="num power">${pair(r.power_avg_w, r.power_max_w)}</td>
      <td class="num power">${fmt(r.ftp, ' W')}</td>
      <td class="num speed">${pair(r.speed_avg_kmh, r.speed_max_kmh)}</td>
      <td class="num hr">${pair(r.heart_rate_avg_bpm, r.heart_rate_max_bpm)}</td>
      <td class="num muted">${fmt(r.cadence_avg)}</td>
      <td class="num muted">${fmt(r.calories)}</td>
      <td class="num muted">${fmt(r.relative_effort)}</td>
    </tr>
  `).join('');

  document.querySelectorAll('thead th[data-key]').forEach(th => {
    th.classList.toggle('sorted', th.dataset.key === sortKey);
  });
}

/* ---------------- Tabs ---------------- */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.view).classList.add('active');
    if (btn.dataset.view === 'graph-view') drawChart();
  });
});

/* ---------------- Graphs ---------------- */
const METRICS = [
  { id: 'power',     label: 'Power',      unit: 'W',     color: '--power', get: r => r.power_avg_w },
  { id: 'ftp',       label: 'FTP',        unit: 'W',     color: '--power', get: r => r.ftp },
  { id: 'speed',     label: 'Speed',      unit: 'km/h',  color: '--speed', get: r => r.speed_avg_kmh },
  { id: 'hr',        label: 'Heart rate', unit: 'bpm',   color: '--hr',    get: r => r.heart_rate_avg_bpm },
  { id: 'distance',  label: 'Distance',   unit: 'km',    color: '--text',  get: r => r.distance_km },
  { id: 'time',      label: 'Time',       unit: 'min',   color: '--text',  get: r => Math.round(parseDuration(r.moving_time) / 60) },
  { id: 'elevation', label: 'Elevation',  unit: 'm',     color: '--text',  get: r => r.elevation_m },
  { id: 'cadence',   label: 'Cadence',    unit: 'rpm',   color: '--text',  get: r => r.cadence_avg },
  { id: 'calories',  label: 'Calories',   unit: 'kcal',  color: '--text',  get: r => r.calories },
  { id: 'effort',    label: 'Effort',     unit: '',      color: '--text',  get: r => r.relative_effort },
];

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function buildMetricPicker() {
  const wrap = document.getElementById('metric-picker');
  wrap.innerHTML = METRICS.map(m => `<button class="metric-btn" data-metric="${m.id}">${m.label}</button>`).join('');
  wrap.querySelectorAll('.metric-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeMetric = btn.dataset.metric;
      drawChart();
    });
  });
}

function formatAxisDate(d, showYear) {
  const opts = showYear ? { day: 'numeric', month: 'short', year: '2-digit' } : { day: 'numeric', month: 'short' };
  return d.toLocaleDateString('en-GB', opts);
}

function drawChart() {
  const wrap = document.getElementById('metric-picker');
  wrap.querySelectorAll('.metric-btn').forEach(btn => {
    const m = METRICS.find(mm => mm.id === btn.dataset.metric);
    const active = btn.dataset.metric === activeMetric;
    btn.classList.toggle('active', active);
    btn.style.borderColor = active ? cssVar(m.color) : '';
    btn.style.color = active ? cssVar(m.color) : '';
    btn.style.background = active ? 'rgba(255,255,255,0.03)' : '';
  });

  const metric = METRICS.find(m => m.id === activeMetric);
  const container = document.getElementById('chart-container');

  const points = currentRides
    .map(r => ({ date: new Date(r.date), value: metric.get(r), ride: r }))
    .filter(p => p.value !== null && p.value !== undefined && !isNaN(p.date.getTime()))
    .sort((a, b) => a.date - b.date);

  if (points.length === 0) {
    container.innerHTML = `<div class="chart-empty">No data for ${metric.label} yet.</div>`;
    return;
  }

  const W = 900, H = 340;
  const padL = 46, padR = 20, padT = 20, padB = 36;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  let xMin = points[0].date.getTime();
  let xMax = points[points.length - 1].date.getTime();
  if (xMin === xMax) { xMin -= 86400000; xMax += 86400000; }

  let values = points.map(p => p.value);
  let yMin = Math.min(...values);
  let yMax = Math.max(...values);
  if (yMin === yMax) { yMin -= 1; yMax += 1; }
  const yPad = (yMax - yMin) * 0.15;
  yMin -= yPad; yMax += yPad;
  if (metric.id !== 'elevation' && yMin > 0 && (yMin / (yMax - yMin)) < 0.3) yMin = 0;

  const xScale = t => padL + ((t - xMin) / (xMax - xMin)) * plotW;
  const yScale = v => padT + plotH - ((v - yMin) / (yMax - yMin)) * plotH;

  const color = cssVar(metric.color) || cssVar('--text');
  const lineColor = metric.color === '--text' ? cssVar('--muted') : color;

  const linePoints = points.map(p => `${xScale(p.date.getTime())},${yScale(p.value)}`).join(' ');
  const areaPoints = `${xScale(points[0].date.getTime())},${padT + plotH} ` + linePoints +
    ` ${xScale(points[points.length - 1].date.getTime())},${padT + plotH}`;

  const tickCount = 4;
  let yTicks = [];
  for (let i = 0; i <= tickCount; i++) yTicks.push(yMin + (i * (yMax - yMin) / tickCount));

  const maxXTicks = 7;
  const step = Math.max(1, Math.ceil(points.length / maxXTicks));
  const spansMultipleYears = points[0].date.getFullYear() !== points[points.length - 1].date.getFullYear();
  let xTicks = [];
  for (let i = 0; i < points.length; i += step) xTicks.push(points[i]);
  if (xTicks[xTicks.length - 1] !== points[points.length - 1]) xTicks.push(points[points.length - 1]);

  const gridLines = yTicks.map(v => `
    <line x1="${padL}" y1="${yScale(v)}" x2="${W - padR}" y2="${yScale(v)}" stroke="${cssVar('--line')}" stroke-width="1" />
    <text x="${padL - 8}" y="${yScale(v) + 3}" text-anchor="end" font-size="10" fill="${cssVar('--muted')}" font-family="IBM Plex Mono, monospace">${Math.round(v)}</text>
  `).join('');

  const xLabels = xTicks.map(p => `
    <text x="${xScale(p.date.getTime())}" y="${H - 12}" text-anchor="middle" font-size="10" fill="${cssVar('--muted')}" font-family="IBM Plex Mono, monospace">${formatAxisDate(p.date, spansMultipleYears)}</text>
  `).join('');

  const dots = points.map((p, i) => `
    <circle class="pt" data-i="${i}" cx="${xScale(p.date.getTime())}" cy="${yScale(p.value)}" r="3.5" fill="${lineColor}" stroke="${cssVar('--panel')}" stroke-width="1.5" />
  `).join('');

  container.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${gridLines}
      <polygon points="${areaPoints}" fill="${lineColor}" opacity="0.08" />
      <polyline points="${linePoints}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      ${dots}
      ${xLabels}
      <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="${cssVar('--line')}" stroke-width="1" />
    </svg>
  `;

  const tooltip = document.getElementById('tooltip');
  container.querySelectorAll('.pt').forEach(circle => {
    circle.addEventListener('mouseenter', () => {
      const p = points[+circle.dataset.i];
      tooltip.innerHTML = `<span class="t-date">${p.date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</span><br><span class="t-val">${p.value}${metric.unit ? ' ' + metric.unit : ''}</span>`;
      tooltip.style.display = 'block';
    });
    circle.addEventListener('mousemove', (e) => {
      const rect = container.getBoundingClientRect();
      tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
      tooltip.style.top = (e.clientY - rect.top - 30) + 'px';
    });
    circle.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
  });
}

/* ---------------- Boot ---------------- */
function render(data) {
  currentRides = data.rides || [];
  renderTotals(currentRides);
  renderRows();
  if (document.getElementById('graph-view').classList.contains('active')) drawChart();
  document.getElementById('status').textContent = `Loaded ${currentRides.length} ride(s) from data.json`;
}

document.querySelectorAll('thead th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = key;
      sortAsc = true;
    }
    renderRows();
  });
});

function showPicker() {
  document.getElementById('picker-wrap').classList.add('show');
  document.getElementById('status').textContent = '';
  document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = JSON.parse(evt.target.result);
        render(data);
        document.getElementById('picker-wrap').classList.remove('show');
      } catch (err) {
        document.getElementById('status').textContent = 'Could not parse that file as JSON.';
      }
    };
    reader.readAsText(file);
  });
}

buildMetricPicker();

fetch('data.json')
  .then(res => {
    if (!res.ok) throw new Error('not found');
    return res.json();
  })
  .then(render)
  .catch(() => showPicker());
</script>
</body>
</html>
